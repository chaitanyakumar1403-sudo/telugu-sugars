<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- Tiger-orange handloom check with a Pochampally-style ikat diamond; the displacement gives the feathered ikat edge. -->
  <defs>
    <filter id="ikat" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.035 0.7" numOctaves="2" seed="7" stitchTiles="stitch"/><feDisplacementMap in="SourceGraphic" scale="5" xChannelSelector="R" yChannelSelector="G"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="1.3" numOctaves="2" seed="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.17 0 0 0 0 0.11 0 0 0 0 0.08 0 0 0 0.09 0"/></filter>
  </defs>
  <rect width="120" height="120" fill="#ffffff"/>
  <g filter="url(#ikat)">
    <rect x="-6" y="-6" width="66" height="132" fill="#fd6a02" fill-opacity=".38"/>
    <rect x="-6" y="-6" width="132" height="66" fill="#fd6a02" fill-opacity=".38"/>
    <path d="M90 74 106 90 90 106 74 90Z" fill="#c24e00"/>
    <path d="M90 82 98 90 90 98 82 90Z" fill="#ffffff"/>
    <path d="M30 22 38 30 30 38 22 30Z" fill="#ffffff" fill-opacity=".92"/>
    <path d="M60 87v6M57 90h6M120 27v6M117 30h6M0 27v6M-3 30h6" stroke="#c24e00" stroke-width="2"/>
  </g>
  <rect width="120" height="120" filter="url(#grain)"/>
</svg>
